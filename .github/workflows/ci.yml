name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  jvm:
    name: JVM tests and ktlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: ktlint
        run: ./gradlew ktlintCheck
      - name: Unit tests (pure Kotlin modules)
        run: ./gradlew :core-game:test :core-goserver:test :core-dgs:test

  android:
    name: Debug APK
    runs-on: ubuntu-latest
    needs: jvm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew :app-android:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: turnzen-debug-apk
          path: app-android/build/outputs/apk/debug/*.apk
