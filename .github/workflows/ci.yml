name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  jvm:
    name: JVM tests and ktlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: ktlint
        run: ./gradlew ktlintCheck
      - name: Unit tests (pure Kotlin modules)
        run: ./gradlew :core-game:test :core-goserver:test :core-dgs:test :core-ogs:test
      - name: iOS compile (multiplatform modules)
        run: ./gradlew compileIos
      - name: Unit tests (app view models, JVM)
        run: ./gradlew :app-android:testDebugUnitTest

  android:
    name: Debug APK
    runs-on: ubuntu-latest
    needs: jvm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble preview APK
        run: ./gradlew :app-android:assemblePreview
      # Keep only recent main builds: the account's artifact storage quota is small.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: turnzen-preview-apk
          path: app-android/build/outputs/apk/preview/*.apk
          retention-days: 3
